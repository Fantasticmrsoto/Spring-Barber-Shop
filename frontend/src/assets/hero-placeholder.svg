<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Imagen de referencia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0bd6a"/>
      <stop offset="1" stop-color="#a9812f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="820" rx="28" fill="none" stroke="#c8a24a" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="16 14"/>

  <g transform="translate(600 360)">
    <circle r="150" fill="#c8a24a" fill-opacity="0.08"/>
    <circle r="150" fill="none" stroke="url(#gold)" stroke-width="5" stroke-opacity="0.65"/>

    <g stroke="url(#gold)" stroke-width="14" stroke-linecap="round">
      <line x1="-46" y1="-84" x2="34" y2="60"/>
      <line x1="46" y1="-84" x2="-34" y2="60"/>
    </g>

    <circle cx="-30" cy="86" r="24" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="30" cy="86" r="24" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="6" fill="#f3ede1">
    IMAGEN DE REFERENCIA
  </text>
  <text x="600" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="3" fill="#f3ede1" fill-opacity="0.55">
    Reemplázala por una foto de la barbería
  </text>
</svg>
