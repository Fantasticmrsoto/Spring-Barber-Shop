# Blueprint de Render (https://render.com/docs/blueprint-spec).
#
# Define el servicio web de la API. Con este archivo, Render puede crear el
# servicio solo leyendo el repositorio: en el panel, "New > Blueprint" y se
# elige este repositorio.
#
# La base de datos NO se define aquí a propósito: el plan gratuito de Render
# para PostgreSQL caduca a los 30 días. Se usa Neon (plan gratuito sin
# caducidad) y se pega su URL de conexión en la variable DATABASE_URL.
services:
  - type: web
    name: springbarber-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Se genera un valor aleatorio en el panel de Render. La app no arranca
      # sin JWT_SECRET: es el secreto con el que se firman los tokens.
      - key: JWT_SECRET
        generateValue: true
      # Hay un proxy de Render delante de la app: sin esto, todas las
      # peticiones parecerían venir de la misma IP y el limitador de intentos
      # de login se agotaría para todos los usuarios a la vez.
      - key: TRUST_PROXY
        value: "1"
      # URL de conexión de Neon. Se rellena en el panel (sync: false = no
      # se pide en el momento de crear el blueprint).
      - key: DATABASE_URL
        sync: false
      # Si la web y la API comparten dominio, CORS no hace falta (same-origin).
      # Si la API vive en api.dominio.com, hay que restringirlo:
      # - key: CORS_ORIGIN
      #   value: https://springbarbershop.com,https://www.springbarbershop.com

  # ---------------------------------------------------------------------------
  # Sitio estático de la web (React + Vite). Render lo publica en su CDN.
  #
  # `routes` es lo que hace que la web funcione como una SPA: sin esa
  # reescritura, al recargar en /admin o /login el servidor responde un 404 en
  # vez de servir el index.html, y el panel de administración se queda en
  # blanco. Equivalente a añadir en el panel la regla
  # "Redirects/Rewrites > Rewrite: /*  ->  /index.html".
  # ---------------------------------------------------------------------------
  - type: web
    runtime: static
    name: spring-barber-shop-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      # La web y la API están en servicios distintos: la web llama a la API
      # por su URL completa. Si algún día se sirven desde el mismo dominio,
      # esto se deja vacío y la API contesta en /api.
      - key: VITE_API_URL
        value: https://spring-barber-shop.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
#
# ---------------------------------------------------------------------------
# Si en lugar de este blueprint se crea un "Web Service" con el runtime de
# Node (sin Docker), la configuración equivalente es:
#
#   Root Directory:  backend
#   Build Command:   npm install
#   Start Command:   npm run start:prod     <- aplica migraciones y arranca
#   Health Check:    /api/salud
#
# El Start Command importa: sin él, la base de datos se queda sin esquema y
# todas las peticiones fallan con "relation does not exist".
# ---------------------------------------------------------------------------
